# Rust's side of pkg/toml/bench (#6048): the `toml` crate into toml::Table
# and `toml_edit` into DocumentMut, pinned exactly; Cargo.lock is committed.
[package]
name = "tomlbench-rust"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
toml = "=1.1.6"
toml_edit = "=0.25.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
