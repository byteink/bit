name: winget

# Updates the byteink.bit manifest in the microsoft/winget-pkgs fork and opens
# a PR upstream, mirroring #359 (brew) / #360 (install.sh) for winget.
#
# Fires on `release: published`, NOT as a job inside release.yml. release.yml's
# `release` job always creates a DRAFT (a human presses publish after checking
# the artifacts) — GitHub does not serve `/releases/download/<tag>/<asset>`
# URLs for a draft's assets, and a job in that same workflow run has no way to
# wait for the later, asynchronous, manual publish click. `release: published`
# is the actual signal that the assets are public, so this workflow runs only
# once that has happened — same pattern used by winget-releaser-style actions.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  winget:
    name: winget package update
    runs-on: windows-latest
    steps:
      # No such thing as a `dist-windows` job to depend on yet: #1103 shipped
      # the PE/COFF writer but not the CLI `--target x86_64-windows` wiring or
      # the Windows runtime port, so #358's matrix has no windows entry (see
      # dist/README.md's target table). Until it does, every published release
      # is checked for the two windows assets before anything else runs, so
      # this never fabricates a URL or acts on an artifact that doesn't exist.
      #
      # PREREQ (not yet configured): a byteink fork of microsoft/winget-pkgs,
      # and a PAT with contents+PR scope on that fork stored as WINGET_PAT.
      - name: check for windows release assets
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart("v")
          $x64Name = "bit-$version-windows-x86_64.zip"
          $arm64Name = "bit-$version-windows-aarch64.zip"
          $assetsJson = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $names = $assetsJson.assets.name
          if (($names -contains $x64Name) -and ($names -contains $arm64Name)) {
            "ready=true" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          } else {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "winget: $x64Name / $arm64Name not in release $tag yet (#1103) — skipping"
          }

      - name: install wingetcreate
        if: ${{ steps.check.outputs.ready == 'true' }}
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: update manifest and submit PR
        if: ${{ steps.check.outputs.ready == 'true' }}
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.check.outputs.version }}"
          $tag = "${{ github.event.release.tag_name }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $x64Url = "$base/bit-$version-windows-x86_64.zip"
          $arm64Url = "$base/bit-$version-windows-aarch64.zip"
          .\wingetcreate.exe update byteink.bit --version $version --urls $x64Url $arm64Url --submit --token $env:WINGET_PAT
