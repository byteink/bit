name: CI

# Manual-only for now: Actions minutes are capped (macOS bills 10x), so CI does
# not auto-run on push/PR. Trigger a run from the Actions tab (Run workflow) or
# `gh workflow run CI` when a checkpoint is ready to validate across targets.
on:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `zig build`'s default install target IS the self-hosted `bit` on a
      # native host (build.zig: "The canonical `bit` ... this is the compiler
      # that retires the seed"); `zig build test` drives the golden/examples/
      # stress/imports corpus through that same self-hosted binary, with
      # `bit-seed` kept only as the bootstrap tool and differential oracle.
      # This IS "CI's primary build switches to the self-hosted compiler"
      # (gate #365) — no restructuring needed, the build graph already made
      # self-hosted `bit` primary; this step just builds+exercises it.
      - run: zig build
      - run: zig build test
      # Self-hosting gate (epic #363-#365): the self-hosted `bit` must agree
      # with the retired seed (`bit-seed`) across the corpus, and must
      # reproducibly build itself. Runs natively on each matrix arch (x86_64 on
      # ubuntu, arm64 on macos). `diffall.sh` is the whole #1332 differential
      # family, self-discovered rather than hand-listed — a hand-listed subset
      # is exactly how #1761 (an x86_64-only `bit fmt` SIGSEGV) shipped
      # unnoticed: the old list here never called selfhost-difffmt.sh, which is
      # the one script that actually catches it.
      - name: self-host differentials (bit-seed vs bit, full #1332 family)
        run: bash scripts/selfhost-diffall.sh
      - run: zig build fuzz -- 60

  vscode-extension:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run vscode:prepublish
      - run: npx vsce package
