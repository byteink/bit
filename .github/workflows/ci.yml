name: CI

# Manual-only for now: Actions minutes are capped (macOS bills 10x), so CI does
# not auto-run on push/PR. Trigger a run from the Actions tab (Run workflow) or
# `gh workflow run CI` when a checkpoint is ready to validate across targets.
on:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test
      - run: zig build fuzz -- 60

  vscode-extension:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run vscode:prepublish
      - run: npx vsce package
