name: CI

# Manual-only for now: Actions minutes are capped (macOS bills 10x), so CI does
# not auto-run on push/PR. Trigger a run from the Actions tab (Run workflow) or
# `gh workflow run CI` when a checkpoint is ready to validate across targets.
on:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test
      # Self-hosting gate (epic #363-#365): the self-hosted `bit` must agree with
      # the retired seed (`bit-seed`) across the corpus, and must reproducibly
      # build itself. Runs natively on each matrix arch (x86_64 on ubuntu, arm64
      # on macos). diffcheck's own exit code fails the build on any FALSEPOS.
      - name: self-host differentials (bit-seed vs bit)
        run: |
          bash scripts/selfhost-diffcheck.sh
          bash scripts/selfhost-difftypes.sh
          bash scripts/selfhost-diffexamples.sh
          bash scripts/selfhost-fixpoint.sh
      - run: zig build fuzz -- 60

  vscode-extension:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run vscode:prepublish
      - run: npx vsce package
