name: Release

# Fires on a version tag, and can be dry-run by hand from the Actions tab.
#
# WHY THERE IS NO SIX-WAY CROSS MATRIX: producing the shipping `bit` means
# EXECING the bootstrap seed to compile `selfhost/` (build.zig, `native`), so the
# runner must be able to run the seed. What it CAN do is cross-*produce*: a
# native seed emits an executable for any target the compiler supports
# (`bit-seed build selfhost --target <t>`). The compiler supports exactly three
# targets today, so three artifacts ship. Windows (#1103, PE/COFF writer) and
# x86_64-macos (no Mach-O x86-64 relocations) are absent on purpose — see
# dist/README.md for the target table and the full artifact contract that #359
# (brew), #360 (install.sh) and #361 (winget) consume.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0-rc1)"
        required: true
        type: string
      publish:
        description: "Create a DRAFT GitHub Release (never published automatically)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip the test matrix — pipeline plumbing checks ONLY, never for a real release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.16.0" # pinned; must match .zigversion

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${{ inputs.version }}"
            publish="${{ inputs.publish }}"
          fi
          # Reject anything that would produce a nonsense artifact name.
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${version}' is not a semver version" >&2
            exit 1
          fi
          # A version with a pre-release suffix ships as a GitHub pre-release.
          case "${version}" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

  # The full gate, unmodified from CI: unit + golden + examples + stress +
  # imports + docs harnesses, the self-host differentials, and the fuzzer. Every
  # dist job depends on it, so nothing is packaged from a tree that did not pass.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'push' || !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - run: zig build test
      - name: self-host differentials (bit-seed vs bit)
        run: |
          bash scripts/selfhost-diffcheck.sh
          bash scripts/selfhost-diffverdict.sh
          bash scripts/selfhost-difftypes.sh
          bash scripts/selfhost-diffexamples.sh
          bash scripts/selfhost-fixpoint.sh
      - run: zig build fuzz -- 60

  # One dist job per runner architecture, because the seed must be runnable.
  # ubuntu-24.04 is x86_64, so it builds its own target natively and
  # cross-produces aarch64-linux; macos-14 is arm64 and builds aarch64-macos.
  # Adding a target = one matrix entry + one `case` arm in dist/package.sh.
  dist:
    name: dist ${{ matrix.target }}
    needs: [meta, test]
    # `always()` so a deliberate skip_tests dry run still reaches this job, but
    # a FAILED test matrix still blocks it. Never let a red gate ship a binary.
    if: ${{ always() && needs.meta.result == 'success' && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux,  native: true }
          - { os: ubuntu-24.04, target: aarch64-linux, native: false }
          - { os: macos-14,     target: aarch64-macos, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      # Every supported runtime archive, not just this target's: the shipped
      # compiler carries all three so a user can re-point BIT_LIBBITRT and
      # cross-compile from one install (dist/README.md).
      - name: build runtime archives
        run: zig build libbitrt

      - name: build the bootstrap seed
        run: zig build

      - name: cross-produce the self-hosted bit for ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/out/stage/bin
          ./zig-out/bin/bit-seed build selfhost --target ${{ matrix.target }} -o dist/out/stage/bin/bit
          chmod +x dist/out/stage/bin/bit

      - name: package
        shell: bash
        run: bash dist/package.sh "${{ needs.meta.outputs.version }}" "${{ matrix.target }}" "$PWD/dist/out"

      - name: install qemu-user-static (cross target smoke test)
        if: ${{ !matrix.native }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static

      # Smoke-test the UNPACKED ARTIFACT, not the staging tree: the bytes that
      # ship are the only thing worth testing. This ordering is not incidental —
      # it is what caught macOS bsdtar serialising an AppleDouble `._foo.bit`
      # beside every stdlib source, which the shipped compiler then globbed as
      # real input. A staging-tree test would have passed.
      #
      # Unpack somewhere unrelated, set only the two documented variables
      # (dist/README.md), and require the binary to COMPILE AND RUN a program —
      # a version banner proves nothing about a compiler.
      - name: smoke test the unpacked artifact
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(ls "$PWD"/dist/out/*.tar.xz)"
          runner=""
          [ "${{ matrix.native }}" = "true" ] || runner="qemu-aarch64-static"
          work="$(mktemp -d)"
          tar -C "$work" -xf "$pkg"
          prefix="$(ls -d "$work"/bit-*)"
          mkdir -p "$work/proj" && cd "$work/proj"
          printf 'function main() {\n  print("smoke ok\\n")\n}\n' > smoke.bit
          export BIT_STDLIB="$prefix/stdlib"
          export BIT_LIBBITRT="$prefix/lib/${{ matrix.target }}/libbitrt.a"
          $runner "$prefix/bin/bit" build smoke.bit -o smoke
          out="$($runner ./smoke)"
          [ "$out" = "smoke ok" ] || { echo "::error::smoke test printed '$out'"; exit 1; }
          echo "smoke test passed for ${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bit-${{ matrix.target }}
          path: dist/out/*.tar.xz
          if-no-files-found: error
          retention-days: 7

  # The toolchain as a container image: ghcr.io/byteink/bit. Built from the
  # RELEASE ARTIFACTS this run already produced, not from source — the tarball a
  # user installs and the image that shares its version tag must be the same
  # bytes, or the image silently diverges from the release it is named after.
  #
  # `needs: [meta, dist]` and not `[release]`: it consumes artifacts, not the
  # published release, so it runs alongside the draft rather than after it. A
  # failure here does not block the release assets that are already built.
  image:
    name: toolchain image
    needs: [meta, dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io under this repo's owner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Both linux tarballs land in dist/out/, where docker/toolchain.Dockerfile
      # expects them; TARGETARCH picks the right one per platform.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/out
          pattern: bit-*-linux
          merge-multiple: true

      - name: what arrived
        run: ls -la dist/out/

      # QEMU only to RUN the arm64 layer's smoke test; nothing is compiled under
      # emulation — the binaries are already built.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only on a real tag: a workflow_dispatch dry run must never move
      # the tag users pull by default.
      - name: build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BIT_VERSION=${{ needs.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bit:${{ needs.meta.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/bit:latest', github.repository_owner) || '' }}

      # Prove the PUSHED image runs, on both architectures, by compiling and
      # running a program with it. A version banner would prove nothing about a
      # compiler, which is the same reason the dist job smoke-tests the unpacked
      # tarball rather than the staging tree.
      - name: smoke test the pushed image
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/bit:${{ needs.meta.outputs.version }}"
          work="$(mktemp -d)"
          printf 'function main() {\n  print("image ok\\n")\n}\n' > "$work/smoke.bit"
          for plat in linux/amd64 linux/arm64; do
            echo "== $plat =="
            out="$(docker run --rm --platform "$plat" -v "$work:/work" "$ref" run smoke.bit)"
            [ "$out" = "image ok" ] || { echo "unexpected output on $plat: $out" >&2; exit 1; }
          done

  release:
    name: draft release
    needs: [meta, dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # changelog.sh walks back to the previous tag

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # CycloneDX 1.7 SBOM (task #1752). Generated via the official
      # cyclonedx-python-lib rather than hand-rolled JSON — dist/sbom.py owns
      # the component list; dist/sbom-requirements.txt is the one place the
      # lib version is pinned (dist/sbom_test.py reads the same file). Lands
      # in artifacts/ before checksums and the release-asset glob so it is
      # covered by both.
      #
      # ubuntu-24.04's system Python is PEP 668 externally-managed, so a bare
      # `pip install` fails with "externally-managed-environment" — a venv
      # sidesteps that without needing --break-system-packages.
      - name: sbom
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --quiet --require-hashes -r dist/sbom-requirements.txt
          /tmp/sbom-venv/bin/python3 dist/sbom.py "${{ needs.meta.outputs.version }}" "${{ env.ZIG_VERSION }}" \
            > "artifacts/bit-${{ needs.meta.outputs.version }}.cdx.json"

      # Schema-validate what sbom.py produced, every release — not a one-off
      # manual check. cyclonedx-cli is fetched pinned by version + checksum
      # (ubuntu-24.04 runner is x86_64, matching this binary).
      - name: validate sbom
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cyclonedx-cli \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  /tmp/cyclonedx-cli" | sha256sum -c -
          chmod +x /tmp/cyclonedx-cli
          /tmp/cyclonedx-cli validate \
            --input-file "artifacts/bit-${{ needs.meta.outputs.version }}.cdx.json" \
            --input-version v1_7 --fail-on-errors

      # One SHA256SUMS covering every published artifact, in GNU sha256sum
      # format with bare filenames — the format dist/README.md promises #359-#361.
      - name: checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.xz *.zip *.cdx.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no artifacts to checksum"; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: changelog
        run: bash dist/changelog.sh "${{ needs.meta.outputs.version }}" "${{ github.sha }}" > NOTES.md

      # Always a DRAFT: publishing is outward-facing and irreversible in
      # practice, so a human presses the button after checking the artifacts.
      - name: create draft release
        if: ${{ needs.meta.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.meta.outputs.version }}"
          args=(--draft --title "Bit ${{ needs.meta.outputs.version }}" --notes-file NOTES.md)
          [ "${{ needs.meta.outputs.prerelease }}" = "true" ] && args+=(--prerelease)
          # On a dispatch dry run the tag may not exist; point it at this commit.
          [ "${{ github.event_name }}" = "push" ] || args+=(--target "${{ github.sha }}")
          gh release create "$tag" "${args[@]}" artifacts/*

      - name: dry run summary
        if: ${{ needs.meta.outputs.publish != 'true' }}
        run: |
          {
            echo "### Dry run — no release created"
            echo
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
            echo
            cat NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
