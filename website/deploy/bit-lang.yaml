# bit-lang.byteink.com — static site in the byteink namespace.
#
# The page content is NOT in this file: website/deploy.sh builds the
# `bit-lang-site` ConfigMap from website/public/ so the served bytes are always
# the generated ones. Apply with website/deploy.sh, not `kubectl apply -f` alone.
#
# ponytail: nginx over a ConfigMap. No image to build, no registry, no CI — the
# site is two static files. Revisit if it ever needs a build step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bit-lang
  namespace: byteink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bit-lang
  template:
    metadata:
      labels:
        app: bit-lang
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /support.html
              port: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: site
          configMap:
            name: bit-lang-site
---
apiVersion: v1
kind: Service
metadata:
  name: bit-lang
  namespace: byteink
spec:
  selector:
    app: bit-lang
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bit-lang
  namespace: byteink
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`bit-lang.byteink.com`)
      services:
        - name: bit-lang
          port: 80
  tls:
    certResolver: letsencrypt
