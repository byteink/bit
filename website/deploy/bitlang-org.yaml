# bitlang.org — static site in the byteink namespace.
#
# The page content is NOT in this file: website/deploy.sh builds the
# `bitlang-site` ConfigMap from website/public/ so the served bytes are always
# the generated ones. Apply with website/deploy.sh, not `kubectl apply -f` alone.
#
# ponytail: nginx over a ConfigMap. No image to build, no registry, no CI — the
# site is two static files. Revisit if it ever needs a build step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitlang
  namespace: byteink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitlang
  template:
    metadata:
      labels:
        app: bitlang
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /support.html
              port: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: site
          configMap:
            name: bitlang-site
---
apiVersion: v1
kind: Service
metadata:
  name: bitlang
  namespace: byteink
spec:
  selector:
    app: bitlang
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bitlang
  namespace: byteink
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`bitlang.org`)
      services:
        - name: bitlang
          port: 80
  tls:
    certResolver: letsencrypt
---
# bitlang.io / bitlang.net / www.* → https://bitlang.org, permanently.
#
# byteink owns all three, and only ONE may serve content: two live copies split
# search ranking and leave links pointing at whichever a writer happened to
# type. The bare domain is canonical (settled in #1758), so www redirects too.
#
# ponytail: a Traefik middleware, not a second nginx. Nothing to deploy, nothing
# to keep in sync with the real site.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bitlang-canonical
  namespace: byteink
spec:
  redirectRegex:
    # Host is matched by the IngressRoute below; this only rewrites the host part
    # and preserves the path, so a deep link survives the redirect.
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://bitlang.org/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bitlang-canonical
  namespace: byteink
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`bitlang.io`) || Host(`www.bitlang.io`) || Host(`bitlang.net`) || Host(`www.bitlang.net`) || Host(`www.bitlang.org`)
      middlewares:
        - name: bitlang-canonical
      # A redirect still needs a backend for Traefik to accept the route; the
      # middleware answers before the request ever reaches it.
      services:
        - name: bitlang
          port: 80
  tls:
    certResolver: letsencrypt
